name: Build macOS ESP32

on:
  workflow_dispatch:
  push:
    branches: [codex/esp32-exclusive-usb]

permissions:
  contents: read

concurrency:
  group: macos-esp32-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          uname -m
      - name: ESP32 routing tests
        run: |
          bash tests/esp32/run.sh
          python3 tests/esp32/check_project.py
          python3 tests/esp32/button_ordering.py --check
          python3 scripts/generate_settings_search_index.py --check
      - name: Native button queue regression
        run: python3 tests/esp32/button_ordering.py
      - name: Native ESP32 bridge and WebSocket tests
        run: python3 tests/esp32/integration.py
      - name: Native ESP32 status bar regression
        run: python3 tests/esp32/status_bar.py
      - name: Build and check native USB upgrade helper
        run: |
          mkdir -p build/usb-update
          xcrun swiftc -O -framework IOKit -framework Foundation scripts/esp32-usb-helper.swift -o build/usb-update/esp32-usb-helper
          codesign --force --sign - build/usb-update/esp32-usb-helper
          build/usb-update/esp32-usb-helper --list
          python3 -m py_compile scripts/esp32-usb-update.py
          python3 -m unittest discover -s tests/esp32_usb_update -p 'test_*.py'
          python3 scripts/esp32-usb-update.py --list
      - name: Download upstream XCFrameworks
        run: |
          curl --fail --location --retry 3 --output /tmp/xcframeworks.zip \
            https://github.com/coofdy/moonlight-mobile-deps/releases/download/latest/moonlight-apple-xcframeworks.zip
          unzip -q -o /tmp/xcframeworks.zip -d xcframeworks/
      - name: Build dav1d
        run: |
          brew install meson ninja nasm
          bash scripts/build_dav1d.sh
      - name: Build Apple Silicon app
        run: |
          printf 'BUILD_NUMBER = %s\n' "$GITHUB_RUN_NUMBER" > Limelight/Version.xcconfig
          xcodebuild -project Moonlight.xcodeproj \
            -scheme 'Moonlight for macOS' -configuration Release \
            -derivedDataPath build -destination 'platform=macOS,arch=arm64' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=- \
            BUILD_NUMBER="$GITHUB_RUN_NUMBER" UPDATE_DISPLAY_VERSION=1.3.9-esp32-dev \
            SPARKLE_ED_PUBLIC_KEY= SPARKLE_FEED_URL= build
      - name: Sign and package
        run: |
          app=build/Build/Products/Release/MoonlightESP32.app
          lipo "$app/Contents/MacOS/MoonlightESP32" -verify_arch arm64
          python3 scripts/sign_app_bundle.py "$app" \
            --entitlements Moonlight.entitlements \
            --extension-entitlements FileProviderExtension/FileProvider.entitlements
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$app" dist/MoonlightESP32-macOS-arm64.zip
          cp docs/ESP32.md dist/ESP32.md
          cp build/esp32-pixel-format-validation.json dist/esp32-pixel-format-validation.json
          mkdir -p dist/USB-Upgrade
          cp build/usb-update/esp32-usb-helper scripts/esp32-usb-update.py scripts/esp32-usb-update.command dist/USB-Upgrade/
          chmod +x dist/USB-Upgrade/esp32-usb-helper dist/USB-Upgrade/esp32-usb-update.command
          git rev-parse HEAD > dist/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MoonlightESP32-macOS-arm64
          path: dist/
          retention-days: 7
